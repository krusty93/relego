services:
  relego-cli:
    image: ghcr.io/krusty93/relego.cli:latest@sha256:49951d6e4d41a46bb2a76c8f94c28840aecc9927f53d126103319a2353074a32
    restart: "no"
    tty: true
    environment:
      SERVER_URL: http://relego-server:8080
    networks:
      - relego
    profiles: [cli]

  relego-server:
    image: ghcr.io/krusty93/relego.server:latest@sha256:d61ba348777c31a5de547f7b4bc307a380223cb15f923741ffa9f1ad28779bb9
    restart: unless-stopped
    environment:
      # These values seed the configuration on first boot. Settings saved in the web UI
      # take precedence after that.
      SMTP_FROM_ADDRESS: ${RELEGO_SMTP_FROM:-noreply@example.com}
      SMTP_HOST: ${RELEGO_SMTP_HOST:-smtp.example.com}
      SMTP_PORT: "${RELEGO_SMTP_PORT:-587}"
      SMTP_USER: ${RELEGO_SMTP_USER:-}
      SMTP_PASSWORD: ${RELEGO_SMTP_PASSWORD:-}
      KINDLE_EMAIL: ${RELEGO_KINDLE_EMAIL:-}
    ports:
      - "8080:8080"
    volumes:
      - relego-data:/data
    networks:
      - relego
    profiles: [app, demo]

  smtp4dev:
    image: rnwood/smtp4dev:latest@sha256:211a60c1a4f51ff7ace4a35de055797348994b0e84ab36734991235f90f9ac75
    restart: unless-stopped
    environment:
      ServerOptions__Port: "2525"
    ports:
      - "5000:80"
    networks:
      - relego
    profiles: [demo]

volumes:
  relego-data:

networks:
  relego:
