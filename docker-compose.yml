services:
  relego-cli:
    image: ghcr.io/krusty93/relego.cli:latest
    restart: "no"
    tty: true
    environment:
      SERVER_URL: http://relego-server:8080
    networks:
      - relego
    profiles: [client]

  relego-server:
    image: ghcr.io/krusty93/relego.server:latest
    restart: unless-stopped
    environment:
      SMTP_FROM_ADDRESS: noreply@example.com
      KINDLE_EMAIL: your-address@kindle.com

      SMTP_USER: user@example.com
      SMTP_PASSWORD: yourpassword
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"

      # Browser origins allowed to call this API. Must list the relego-web URL you
      # open in your browser; add more, comma-separated, for other machines on the LAN.
      RELEGO_CORS_ORIGINS: http://localhost:8081

      # smtp4dev demo mode: replace the four lines above with these
      # SMTP_PASSWORD: ""
      # ASPNETCORE_ENVIRONMENT: Development
      # SMTP_HOST: smtp4dev
      # SMTP_PORT: "2525"
    ports:
      - "8080:8080"
    volumes:
      - relego-data:/data
    networks:
      - relego
    profiles: [server, demo]

  relego-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      # Resolved by the browser, not by this container, so it points at the
      # published relego-server port on the host.
      RELEGO_API_URL: http://localhost:8080
    ports:
      - "8081:8081"
    depends_on:
      - relego-server
    networks:
      - relego
    profiles: [server, demo]

  smtp4dev:
    image: rnwood/smtp4dev:latest
    restart: unless-stopped
    environment:
      ServerOptions__SmtpPort: "2525"
    ports:
      - "5000:80"
    networks:
      - relego
    profiles: [demo]

volumes:
  relego-data:

networks:
  relego:
