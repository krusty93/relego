<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kindle Notebook</title>
  </head>
  <body>
    <div id="kp-notebook-main">
      <div id="kp-notebook-library">
        <div class="kp-notebook-library-each-book" data-book-key="B00EXAMPLE01" data-highlight-count="3">
          <h2 id="kp-notebook-book-title">The Pragmatic Programmer</h2>
          <p id="kp-notebook-book-author">Andrew Hunt &amp; David Thomas</p>
        </div>
        <div class="kp-notebook-library-each-book" data-book-key="B00EXAMPLE02" data-highlight-count="2">
          <h2 id="kp-notebook-book-title">Dune</h2>
          <p id="kp-notebook-book-author">Frank Herbert</p>
        </div>
        <div class="kp-notebook-library-each-book" data-book-key="B00EXAMPLE03" data-highlight-count="1">
          <h2 id="kp-notebook-book-title">Thinking,   Fast and Slow</h2>
          <p id="kp-notebook-book-author">Daniel Kahneman</p>
          <div id="kp-notebook-export-limit">
            You have reached the publisher's export limit for this book.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
