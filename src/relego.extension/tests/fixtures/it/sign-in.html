<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Amazon Sign-In</title>
  </head>
  <body data-signin-host="www.amazon.it">
    <form id="ap_signin_form" name="signIn" method="post" action="/ap/signin">
      <label for="ap_email">Email or mobile phone number</label>
      <input id="ap_email" name="email" type="email" />
      <label for="ap_password">Password</label>
      <input id="ap_password" name="password" type="password" />
      <input id="signInSubmit" type="submit" value="Sign in" />
    </form>
  </body>
</html>
