name: Release

on:
  push:
    tags:
      - 'cli/v*'
      - 'server/v*'

permissions:
  contents: read

jobs:
  metadata:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.meta.outputs.component }}
      version:   ${{ steps.meta.outputs.version }}
      tag:       ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        name: Get Tags
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COMPONENT="${TAG%%/v*}"
          VERSION="${TAG#*/v}"
          echo "component=$COMPONENT" >> $GITHUB_OUTPUT
          echo "version=$VERSION"     >> $GITHUB_OUTPUT
          echo "tag=$TAG"             >> $GITHUB_OUTPUT

  build-cli:
    name: Build CLI (${{ matrix.rid }})
    needs: metadata
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            ext: .exe
          - rid: win-arm64
            ext: .exe
          - rid: linux-x64
            ext: ""
          - rid: linux-arm
            ext: ""
          - rid: linux-arm64
            ext: ""
          - rid: osx-x64
            ext: ""
          - rid: osx-arm64
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Discover Versioned Components
        id: discover
        uses: ./.github/actions/discover-versioned-components

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish src/Relego.Cli \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            --output publish/${{ matrix.rid }}

      - name: Rename Binary
        run: |
          V="${{ needs.metadata.outputs.version }}"
          RID="${{ matrix.rid }}"
          EXT="${{ matrix.ext }}"
           mv "publish/${RID}/Relego.Cli${EXT}" \
             "publish/relego-${V}-${RID}${EXT}" 2>/dev/null || \
           mv "publish/${RID}/relego${EXT}" \
             "publish/relego-${V}-${RID}${EXT}" 2>/dev/null || \
           find "publish/${RID}" -maxdepth 1 -type f -not -name "*.pdb" -exec mv {} "publish/relego-${V}-${RID}${EXT}" \;

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.rid }}
          path: publish/relego-*

  build-server:
    name: Build Server (${{ matrix.rid }})
    needs: metadata
    if: startsWith(github.ref, 'refs/tags/server/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
          - rid: win-arm64
          - rid: linux-x64
          - rid: linux-arm
          - rid: linux-arm64
          - rid: osx-x64
          - rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/relego.web/package-lock.json

      - name: Publish
        run: |
          dotnet publish src/Relego.Server \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output publish/${{ matrix.rid }}

      - name: Verify web UI assets
        run: |
          test -s publish/${{ matrix.rid }}/wwwroot/index.html
          find publish/${{ matrix.rid }}/wwwroot -type f -name '*.js' -size +1k -print -quit | grep -q .

      - name: Archive Server
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          cd "publish/${RID}"
          zip -r "../../relego-server-${VERSION}-${RID}.zip" .

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.rid }}
          path: relego-server-*.zip

  prepare-cli-release-assets:
    name: Prepare CLI release assets
    needs: [metadata, build-cli]
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      hashes: ${{ steps.sign.outputs.hashes }}
    steps:
      - name: Download CLI Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: artifacts/
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate Signatures and Provenance Subjects
        id: sign
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          pushd artifacts >/dev/null
          mapfile -t binaries < <(find . -maxdepth 1 -type f -print | sed 's#^./##' | sort)

          if [ "${#binaries[@]}" -eq 0 ]; then
            echo "No CLI artifacts found." >&2
            exit 1
          fi

          : > ../subjects.txt

          for binary in "${binaries[@]}"; do
            sha256sum "$binary" >> ../subjects.txt
            cosign sign-blob --yes --bundle "${binary}.sigstore" "$binary"
          done

          cp ../subjects.txt "relego-${VERSION}-checksums.sha256"
          popd >/dev/null

          echo "hashes=$(base64 -w0 subjects.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload CLI Release Assets
        uses: actions/upload-artifact@v7
        with:
          name: cli-release-assets
          path: artifacts/*

  prepare-server-release-assets:
    name: Prepare Server release assets
    needs: [metadata, build-server]
    if: startsWith(github.ref, 'refs/tags/server/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      hashes: ${{ steps.sign.outputs.hashes }}
    steps:
      - name: Download Server Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: artifacts/
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate signatures and provenance subjects
        id: sign
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          pushd artifacts >/dev/null
          mapfile -t archives < <(find . -maxdepth 1 -type f -name '*.zip' -print | sed 's#^./##' | sort)

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No server artifacts found." >&2
            exit 1
          fi

          : > ../subjects.txt

          for archive in "${archives[@]}"; do
            sha256sum "$archive" >> ../subjects.txt
            cosign sign-blob --yes --bundle "${archive}.sigstore" "$archive"
          done

          cp ../subjects.txt "relego-server-${VERSION}-checksums.sha256"
          popd >/dev/null

          echo "hashes=$(base64 -w0 subjects.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload Server release assets
        uses: actions/upload-artifact@v7
        with:
          name: server-release-assets
          path: artifacts/*

  create-release:
    name: Create GitHub Release
    needs: [metadata, build-cli, prepare-cli-release-assets, build-server, prepare-server-release-assets]
    if: always() && needs.metadata.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.notes.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Discover Versioned Components
        id: discover
        uses: ./.github/actions/discover-versioned-components

      - name: Download CLI Release Assets
        if: needs.metadata.outputs.component == 'cli'
        uses: actions/download-artifact@v8
        with:
          name: cli-release-assets
          path: artifacts/

      - name: Download Server Release Assets
        if: needs.metadata.outputs.component == 'server'
        uses: actions/download-artifact@v8
        with:
          name: server-release-assets
          path: artifacts/

      - name: Generate Release Notes
        id: notes
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          COMPONENTS_JSON: ${{ steps.discover.outputs.components_json }}
        run: |
          set -euo pipefail

          format_commit_entry() {
            local sha="$1"
            local subject pr_number short_sha ref

            subject=$(git show -s --format=%s "$sha" | sed -E 's/ \(#[0-9]+\)$//; s/\r$//')
            pr_number=$(git show -s --format=%s "$sha" | sed -nE 's/.* \(#([0-9]+)\)$/\1/p')
            short_sha=$(git rev-parse --short "$sha")

            if [ -n "$pr_number" ]; then
              ref="[#${pr_number}](${REPO_URL}/pull/${pr_number})"
            else
              ref="[${short_sha}](${REPO_URL}/commit/${sha})"
            fi

            printf -- '- %s (%s)' "$subject" "$ref"
          }

          COMPONENT="${{ needs.metadata.outputs.component }}"
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="${{ needs.metadata.outputs.tag }}"

          COMP_PATH=$(printf '%s' "$COMPONENTS_JSON" | jq -r --arg name "$COMPONENT" '.[] | select(.name == $name) | .projectPath')

          if [ -z "$COMP_PATH" ] || [ "$COMP_PATH" = "null" ]; then
            echo "Unsupported component: $COMPONENT" >&2
            exit 1
          fi

          PREVIOUS_TAG=$(git tag -l "${COMPONENT}/v*" --sort=-version:refname | grep -Fxv "$TAG" | head -1 || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
          else
            RANGE="$TAG"
          fi

          RELEASE_DATE=$(git for-each-ref --format='%(creatordate:short)' "refs/tags/$TAG" | head -1)
          if [ -z "$RELEASE_DATE" ]; then
            RELEASE_DATE=$(git log -1 --format=%cs "$TAG")
          fi
          COMMITS=$(git log --reverse --format='%H' "$RANGE" -- "$COMP_PATH")
          BODY=""

          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            ENTRY=$(format_commit_entry "$sha")

            if [ -z "$ENTRY" ]; then
              continue
            fi

            if [ -n "$BODY" ]; then
              BODY=$(printf '%s\n\n%s' "$BODY" "$ENTRY")
            else
              BODY="$ENTRY"
            fi
          done <<< "$COMMITS"

          if [ -z "$BODY" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "## ${VERSION} (${RELEASE_DATE})"
            echo
            echo "### Changes"
            echo
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.notes.outputs.publish == 'true' && (needs.metadata.outputs.component != 'cli' || needs.prepare-cli-release-assets.result == 'success') && (needs.metadata.outputs.component != 'server' || needs.prepare-server-release-assets.result == 'success')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: "${{ needs.metadata.outputs.component }}/${{ needs.metadata.outputs.version }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: artifacts/*
          token: ${{ secrets.RELEASE_TOKEN }}

  cli-provenance:
    name: Generate CLI SLSA Provenance
    needs: [metadata, prepare-cli-release-assets, create-release]
    if: startsWith(github.ref, 'refs/tags/cli/') && needs.create-release.outputs.publish == 'true'
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.prepare-cli-release-assets.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.metadata.outputs.tag }}
      provenance-name: relego-${{ needs.metadata.outputs.version }}.intoto.jsonl

  server-provenance:
    name: Generate Server SLSA Provenance
    needs: [metadata, prepare-server-release-assets, create-release]
    if: startsWith(github.ref, 'refs/tags/server/') && needs.create-release.outputs.publish == 'true'
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.prepare-server-release-assets.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.metadata.outputs.tag }}
      provenance-name: relego-server-${{ needs.metadata.outputs.version }}.intoto.jsonl
