name: Post-Merge

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag-components:
    name: Tag changed components
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Discover Versioned Components
        id: discover
        uses: ./.github/actions/discover-versioned-components

      - name: Tag Component Versions
        env:
          COMPONENTS_JSON: ${{ steps.discover.outputs.components_json }}
        run: |
          set -e
          TAGS=()

          while IFS= read -r component; do
            NAME=$(echo "$component" | jq -r '.name')
            VERSION_FILE=$(echo "$component" | jq -r '.versionFile')
            VERSION_PROPERTY=$(echo "$component" | jq -r '.versionProperty')

            [ -z "$NAME" ] && continue
            [ -z "$VERSION_FILE" ] || [ "$VERSION_FILE" = "null" ] && { echo "⚠️  $NAME: version file not configured, skipping"; continue; }
            [ ! -f "$VERSION_FILE" ] && { echo "⚠️  $NAME: $VERSION_FILE not found, skipping"; continue; }

            VERSION=$(sed -nE "s|.*<${VERSION_PROPERTY}>([^<]+)</${VERSION_PROPERTY}>.*|\1|p" "$VERSION_FILE" | head -1)
            [ -z "$VERSION" ] && { echo "⚠️  $NAME: ${VERSION_PROPERTY} not found, skipping"; continue; }

            TAG="${NAME}/v${VERSION}"

            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "✓ $NAME v$VERSION - tag already exists, nothing to do"
              continue
            fi

            echo "🚀 $NAME: creating tag $TAG"
            git tag -a "$TAG" -m "$NAME v$VERSION"
            TAGS+=("$TAG")
            echo "  ✅ $TAG created"

          done < <(printf '%s' "$COMPONENTS_JSON" | jq -c '.[]')

          if [ ${#TAGS[@]} -eq 0 ]; then
            echo "No new tags to push."
            exit 0
          fi

          # One tag per push: GitHub does not emit tag events for a single push
          # that creates more than three refs, so tag-triggered workflows such as
          # release.yaml would silently never run.
          for TAG in "${TAGS[@]}"; do
            echo "📤 Pushing $TAG"
            git push origin "refs/tags/$TAG:refs/tags/$TAG"
          done
          echo "Tags pushed."
