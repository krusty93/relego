name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/[Rr]elego.**'
      - 'Dockerfile.ci'
      - 'Dockerfile.server'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: false
          context: .
          file: Dockerfile.ci
          target: build
          tags: relego-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          mkdir -p test-results
          docker run --rm \
            -v "${{ github.workspace }}/test-results:/test-results" \
            relego-ci:latest \
            dotnet test /src/Relego.Tests/Relego.Tests.csproj \
              --no-build \
              --configuration Release \
              --logger "trx;LogFileName=results.trx" \
              --results-directory /test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  web:
    name: Test published web UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/relego.web/package-lock.json

      - name: Install dependencies
        working-directory: src/relego.web
        run: npm ci

      - name: Install Playwright browser
        working-directory: src/relego.web
        run: npx playwright install --with-deps chromium

      - name: Test published server and web UI
        working-directory: src/relego.web
        run: npm test

      - name: Upload web test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-artifacts
          path: |
            src/relego.web/playwright-report/
            src/relego.web/test-results/
          if-no-files-found: warn

  server-image:
    name: Build server image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: false
          context: .
          file: Dockerfile.server
          tags: relego-server-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify web UI assets
        run: docker run --rm --entrypoint sh relego-server-ci:latest -c "test -s /app/wwwroot/index.html"
